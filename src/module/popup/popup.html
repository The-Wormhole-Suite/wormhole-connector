<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popup</title>
  <style>
    html,
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(circle at 8% 0%, rgba(42, 126, 255, 0.22), transparent 42%),
        radial-gradient(circle at 95% 20%, rgba(126, 74, 255, 0.16), transparent 38%),
        #111827;
    }

    #popup {
      background: transparent !important;
    }

    #popup .popup-shell {
      background: rgba(24, 31, 45, 0.78) !important;
      border: 1px solid rgba(255, 255, 255, 0.10) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(24px) saturate(135%);
      -webkit-backdrop-filter: blur(24px) saturate(135%);
    }

    #popup .v-card,
    #popup .v-alert,
    #popup .v-field {
      background: rgba(31, 41, 55, 0.66) !important;
      border: 1px solid rgba(255, 255, 255, 0.09) !important;
      box-shadow: none !important;
      backdrop-filter: blur(16px) saturate(125%);
      -webkit-backdrop-filter: blur(16px) saturate(125%);
    }

    #popup .v-card,
    #popup .v-alert {
      border-radius: 12px !important;
    }

    #popup .v-divider {
      opacity: 0.38 !important;
    }

    #popup .popup-status-icon {
      filter: drop-shadow(0 0 11px rgba(91, 173, 255, 0.22));
    }
  </style>
</head>

<body>
<div id="main"></div>
</body>

</html>
