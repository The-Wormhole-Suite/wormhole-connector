name: Create v5.1.0-beta.1

on:
  push:
    branches:
      - chore/release-v5.1.0-beta.1

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point tag at merged GUI revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/dev:refs/remotes/origin/dev --tags
          DEV_SHA=$(git rev-parse refs/remotes/origin/dev)
          EXPECTED_SHA=c10c9266bfa2915e28d41eddae101468efa0739c
          if [[ "$DEV_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Expected dev at ${EXPECTED_SHA}, got ${DEV_SHA}." >&2
            exit 1
          fi
          git tag -fa v5.1.0-beta.1 "$DEV_SHA" -m "Wormhole Connector v5.1.0-beta.1"
          git push --force origin refs/tags/v5.1.0-beta.1

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref dev \
            -f tag=v5.1.0-beta.1
