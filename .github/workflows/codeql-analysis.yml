name: CodeQL

on:
  push:
    branches:
      - master
      - dev
      - release/public-hardening-candidate
    paths:
      - '.github/workflows/codeql-analysis.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig*.json'
      - 'eslint.config.*'
  pull_request:
    branches:
      - dev
      - master
    paths:
      - '.github/workflows/codeql-analysis.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig*.json'
      - 'eslint.config.*'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
