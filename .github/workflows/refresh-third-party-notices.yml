# One-time release validation trigger
name: Validate dependency updates and publish v5.0.1

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/refresh-third-party-notices.yml'

permissions:
  contents: write
  actions: write

env:
  CI: true

jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

      - name: Regenerate third-party notices
        run: npm run notices:generate

      - name: Run complete project checks
        run: npm run check

      - name: Commit validated notices and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-third-party-notices.yml
          git add THIRD_PARTY_NOTICES.txt
          git commit -m 'Refresh third-party notices for v5.0.1'
          git push origin HEAD:dev

      - name: Tag validated dev revision
        shell: bash
        run: |
          set -euo pipefail
          TAG='v5.0.1'
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi
          git tag -a "$TAG" -m 'Wormhole Connector 5.0.1'
          git push origin "$TAG"

      - name: Start existing release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref dev -f tag=v5.0.1
