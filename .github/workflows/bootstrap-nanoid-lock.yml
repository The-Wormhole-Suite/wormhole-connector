name: Bootstrap nanoid security lock

on:
  push:
    branches:
      - security/nanoid-3.3.18

permissions:
  contents: write

jobs:
  update:
    if: github.actor == 'HyperCriSiS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin patched nanoid and regenerate lock metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.overrides = { ...(pkg.overrides || {}), nanoid: '3.3.18' }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, '\t')}\n`)
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: Verify narrow security result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          if (pkg.overrides?.nanoid !== '3.3.18') throw new Error('package.json override is not nanoid 3.3.18')
          if (lock.packages?.['node_modules/nanoid']?.version !== '3.3.18') throw new Error('package-lock nanoid is not 3.3.18')
          NODE

      - name: Remove bootstrap workflow and commit result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-nanoid-lock.yml

          unexpected="$(git diff --name-only | grep -Ev '^(package\.json|package-lock\.json|\.github/workflows/bootstrap-nanoid-lock\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected files changed during lock regeneration:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/bootstrap-nanoid-lock.yml
          git commit -m 'security: pin nanoid 3.3.18'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
