name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v-prefixed tag to publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      release_label: ${{ steps.release.outputs.release_label }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          show-progress: false

      - name: Resolve release target from tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$REQUESTED_TAG"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
            echo "Expected a tag such as v5.2.0 or v5.2.0-rc.1." >&2
            exit 1
          fi

          RELEASE_LABEL=${TAG#v}
          node scripts/release-version.mjs "$RELEASE_LABEL" >/dev/null

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          RELEASE_SHA=$(git rev-parse HEAD)

          if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "Tag ${TAG} points to ${TAG_SHA}, but ${RELEASE_SHA} was checked out." >&2
            exit 1
          fi

          if [[ "$RELEASE_LABEL" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_LABEL=${RELEASE_LABEL}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_label=${RELEASE_LABEL}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tagged source versions before build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs "$TAG"

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

      - name: Run complete project checks
        run: npm run check

      - name: Prepare browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp package.firefox.zip \
            "artifacts/wormhole-connector-${RELEASE_LABEL}-firefox-unsigned.xpi"
          cp package.chrome.zip \
            "artifacts/wormhole-connector-${RELEASE_LABEL}-chrome.zip"

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR=$(mktemp -d)
          SOURCE_ARCHIVE="artifacts/wormhole-connector-${RELEASE_LABEL}-source.zip"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$RELEASE_SHA")
          trap 'rm -rf "$SOURCE_DIR"' EXIT

          git archive "$RELEASE_SHA" | tar -xf - -C "$SOURCE_DIR"
          printf '%s\n' "$RELEASE_SHA" > "$SOURCE_DIR/SOURCE_COMMIT.txt"
          find "$SOURCE_DIR" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +

          (
            cd "$SOURCE_DIR"
            find . -type f -print | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/${SOURCE_ARCHIVE}" -@
          )

      - name: Regenerate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | LC_ALL=C sort \
            | while IFS= read -r artifact; do sha256sum "artifacts/$artifact"; done \
            | sed 's#  artifacts/#  #' > artifacts/SHA256SUMS.txt
          (
            cd artifacts
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload validated release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          RELEASE_LABEL: ${{ needs.build.outputs.release_label }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            RELEASE_ID=$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq '.databaseId')

            if [[ "$IS_PRERELEASE" == "true" ]]; then
              MAKE_LATEST=false
            else
              MAKE_LATEST=true
            fi

            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f name="Wormhole Connector ${RELEASE_LABEL}" \
              -F prerelease="$IS_PRERELEASE" \
              -f make_latest="$MAKE_LATEST" \
              >/dev/null
          else
            RELEASE_ARGS=(
              "$TAG"
              release-assets/*
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "Wormhole Connector ${RELEASE_LABEL}"
              --generate-notes
            )

            if [[ "$IS_PRERELEASE" == "true" ]]; then
              RELEASE_ARGS+=(--prerelease)
            else
              RELEASE_ARGS+=(--latest)
            fi

            gh release create "${RELEASE_ARGS[@]}"
          fi
