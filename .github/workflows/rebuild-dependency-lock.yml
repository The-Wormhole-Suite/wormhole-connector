name: Rebuild dependency metadata

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

env:
  CI: true

jobs:
  rebuild-lock:
    name: rebuild-lock-and-notices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply safe runtime audit fixes
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund --audit-level=critical

      - name: Commit rebuilt lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No package-lock.json changes to commit.'
          else
            git commit -m 'Apply safe runtime audit fixes'
            git push origin HEAD:dev
          fi

      - name: Install rebuilt graph
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

      - name: Regenerate third-party notices
        run: npm run notices:generate

      - name: Commit regenerated notices
        shell: bash
        run: |
          set -euo pipefail
          git add THIRD_PARTY_NOTICES.txt
          if git diff --cached --quiet; then
            echo 'No THIRD_PARTY_NOTICES.txt changes to commit.'
          else
            git commit -m 'Refresh third-party notices'
            git push origin HEAD:dev
          fi
