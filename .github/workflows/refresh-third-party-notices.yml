name: Refresh third-party notices

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/refresh-third-party-notices.yml'

permissions:
  contents: write

env:
  CI: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

      - name: Regenerate notices
        run: npm run notices:generate

      - name: Commit refreshed notices and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-third-party-notices.yml
          git add THIRD_PARTY_NOTICES.txt
          git commit -m 'Refresh third-party notices'
          git push origin HEAD:dev
