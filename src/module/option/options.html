<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: dark;
            --wormhole-bg: #050711;
            --wormhole-deep: #02030a;
            --wormhole-surface: rgba(13, 18, 35, .67);
            --wormhole-stroke: rgba(181, 213, 255, .13);
            --wormhole-text: #f4f7ff;
            --wormhole-soft: #aab5ce;
            --wormhole-faint: #73809e;
            --wormhole-cyan: #57e8ff;
            --wormhole-cyan-bright: #9cf5ff;
            --wormhole-violet: #9d79ff;
            --wormhole-magenta: #ed65ff;
            --wormhole-green: #73f1b8;
            --wormhole-shadow: 0 24px 70px rgba(0, 0, 0, .38);
            --wormhole-radius-xl: 24px;
            --wormhole-radius-lg: 18px;
            --wormhole-sidebar: 286px;
        }

        * { box-sizing: border-box; }
        html { min-width: 320px; background: var(--wormhole-deep); }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--wormhole-text);
            background: linear-gradient(145deg, #03040a 0%, #070a16 50%, #050711 100%);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        a { color: inherit; text-decoration: none; }

        .space { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
        .space::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 72% 14%, rgba(125, 88, 255, .16), transparent 30%),
                radial-gradient(circle at 42% 78%, rgba(34, 197, 255, .10), transparent 38%),
                linear-gradient(120deg, rgba(2, 4, 12, .3), rgba(7, 9, 24, .22));
        }
        .star-field {
            position: absolute;
            inset: 0;
            opacity: .35;
            background-image:
                radial-gradient(circle at 15% 24%, rgba(255,255,255,.9) 0 1px, transparent 1.3px),
                radial-gradient(circle at 42% 11%, rgba(255,255,255,.55) 0 .8px, transparent 1.1px),
                radial-gradient(circle at 77% 43%, rgba(124,231,255,.8) 0 1px, transparent 1.2px),
                radial-gradient(circle at 82% 82%, rgba(255,255,255,.7) 0 .8px, transparent 1.2px),
                radial-gradient(circle at 53% 58%, rgba(255,255,255,.5) 0 .7px, transparent 1.1px);
            background-size: 310px 280px, 440px 390px, 370px 410px, 520px 460px, 290px 350px;
        }
        .wormhole {
            position: absolute;
            right: -260px;
            top: -240px;
            width: 850px;
            height: 850px;
            border-radius: 50%;
            transform: rotate(-20deg);
        }
        .wormhole--outer {
            background:
                radial-gradient(circle at center, transparent 0 19%, rgba(5,7,17,.94) 20% 27%, transparent 29%),
                conic-gradient(from 20deg, transparent 0 6%, rgba(90,225,255,.34) 9%, transparent 14%, rgba(134,91,255,.42) 22%, transparent 30%, rgba(239,101,255,.22) 39%, transparent 48%, rgba(77,205,255,.32) 58%, transparent 68%, rgba(157,121,255,.38) 78%, transparent 88%, rgba(90,225,255,.28) 96%, transparent 100%);
            mask: radial-gradient(circle, transparent 0 18%, #000 24% 58%, transparent 72%);
            opacity: .72;
            animation: wormhole-drift 38s linear infinite;
        }
        .wormhole--inner {
            right: -116px;
            top: -95px;
            width: 560px;
            height: 560px;
            background:
                radial-gradient(circle, rgba(1,2,8,.97) 0 25%, transparent 26%),
                repeating-conic-gradient(from 0deg, rgba(94,238,255,.10) 0 3deg, transparent 3deg 12deg),
                radial-gradient(circle, transparent 0 30%, rgba(132,94,255,.24) 40%, transparent 65%);
            opacity: .65;
            animation: wormhole-reverse 52s linear infinite;
        }
        @keyframes wormhole-drift { to { transform: rotate(340deg); } }
        @keyframes wormhole-reverse { to { transform: rotate(-380deg); } }

        .wormhole-app {
            --v-theme-background: 5, 7, 17;
            --v-theme-surface: 13, 18, 35;
            --v-theme-on-surface: 244, 247, 255;
            --v-theme-primary: 87, 232, 255;
            color: var(--wormhole-text) !important;
            background: transparent !important;
        }
        .app-shell {
            position: relative;
            display: grid;
            grid-template-columns: var(--wormhole-sidebar) minmax(0, 1fr);
            width: 100%;
            min-height: 100vh;
        }
        .glass-panel {
            background: linear-gradient(145deg, rgba(20,26,48,.72), rgba(9,13,28,.60)) !important;
            border: 1px solid var(--wormhole-stroke) !important;
            box-shadow: var(--wormhole-shadow), inset 0 1px 0 rgba(255,255,255,.045) !important;
            backdrop-filter: blur(22px) saturate(125%);
            -webkit-backdrop-filter: blur(22px) saturate(125%);
        }
        .glass-chip {
            background: rgba(11,17,32,.66);
            border: 1px solid var(--wormhole-stroke);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .sidebar {
            position: fixed;
            inset: 16px auto 16px 16px;
            width: calc(var(--wormhole-sidebar) - 16px);
            z-index: 3;
            display: flex;
            flex-direction: column;
            border-radius: var(--wormhole-radius-xl);
            overflow: hidden;
        }
        .brand { display: flex; align-items: center; gap: 14px; padding: 25px 22px 22px; }
        .brand-mark { position: relative; width: 52px; height: 52px; flex: 0 0 52px; display: grid; place-items: center; }
        .brand-mark::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: conic-gradient(from 30deg, var(--wormhole-cyan), var(--wormhole-violet), var(--wormhole-magenta), var(--wormhole-cyan));
            filter: blur(8px);
            opacity: .68;
        }
        .brand-mark__ring {
            position: absolute;
            inset: 5px;
            border: 2px solid rgba(151,244,255,.75);
            border-left-color: rgba(198,118,255,.85);
            border-bottom-color: rgba(255,255,255,.16);
            border-radius: 48% 52% 44% 56%;
            transform: rotate(-28deg);
            box-shadow: 0 0 18px rgba(87,232,255,.32), inset 0 0 12px rgba(157,121,255,.20);
        }
        .brand-mark__core {
            width: 17px;
            height: 17px;
            z-index: 1;
            border-radius: 50%;
            background: #03040c;
            box-shadow: 0 0 0 4px rgba(7,10,24,.76), 0 0 16px rgba(117,237,255,.7);
        }
        .brand-copy { min-width: 0; }
        .brand-copy strong { display: block; font-size: 20px; line-height: 1.05; letter-spacing: -.03em; }
        .suite-name, .eyebrow, .build-label { display: block; color: var(--wormhole-cyan-bright); font-size: 9px; font-weight: 800; letter-spacing: .18em; }
        .suite-name { margin-bottom: 7px; white-space: nowrap; }
        .sidebar-divider { height: 1px; margin: 0 18px 13px; background: linear-gradient(90deg, transparent, rgba(151,224,255,.22), transparent); }
        .navigation { display: flex; flex-direction: column; gap: 5px; padding: 4px 12px; }
        .nav-item {
            position: relative;
            display: grid;
            grid-template-columns: 22px 1fr auto;
            align-items: center;
            gap: 12px;
            min-height: 46px;
            padding: 0 13px;
            color: var(--wormhole-soft);
            border: 1px solid transparent;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 620;
            transition: .18s ease;
        }
        .nav-item .v-icon { width: 20px; height: 20px; opacity: .82; }
        .nav-item:hover { color: var(--wormhole-text); background: rgba(115,142,188,.08); border-color: rgba(172,215,255,.08); }
        .nav-item--active { color: #eafcff; background: linear-gradient(90deg, rgba(62,197,238,.14), rgba(137,91,255,.08)); border-color: rgba(101,226,255,.16); }
        .nav-item--active .v-icon { color: var(--wormhole-cyan); filter: drop-shadow(0 0 7px rgba(87,232,255,.5)); }
        .nav-indicator { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
        .nav-item--active .nav-indicator { background: var(--wormhole-cyan); box-shadow: 0 0 10px var(--wormhole-cyan); }
        .nav-separator { height: 1px; margin: 9px 10px; background: rgba(255,255,255,.07); }
        .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 5px; padding: 18px 22px 21px; color: var(--wormhole-faint); font-size: 10px; line-height: 1.35; border-top: 1px solid rgba(255,255,255,.055); background: rgba(4,7,17,.18); }
        .sidebar-footer .build-label { color: #94bcd1; font-size: 8px; }

        .main-content { grid-column: 2; width: min(100%, 1480px); padding: 54px 48px 42px 36px; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; margin: 0 4px 27px; }
        .eyebrow { margin-bottom: 8px; }
        .page-header h1 { margin: 0; font-size: clamp(34px, 4vw, 52px); line-height: .98; letter-spacing: -.045em; }
        .page-header p { margin: 12px 0 0; color: var(--wormhole-soft); font-size: 15px; }
        .header-status { display: flex; align-items: center; gap: 11px; min-width: 190px; padding: 12px 15px; border-radius: 14px; box-shadow: 0 12px 35px rgba(0,0,0,.24); }
        .header-status > div { display: flex; flex-direction: column; gap: 2px; }
        .header-status strong { font-size: 13px; }
        .header-status span:last-child { color: var(--wormhole-faint); font-size: 11px; }
        .status-dot { width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; background: var(--wormhole-green); box-shadow: 0 0 0 4px rgba(115,241,184,.08), 0 0 12px rgba(115,241,184,.65); }

        .card { position: relative; padding: 28px; border-radius: var(--wormhole-radius-xl) !important; overflow: hidden; }
        .connection-card { margin-bottom: 20px; }
        .card-heading { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-bottom: 25px; }
        .card-heading--compact { margin-bottom: 23px; }
        .card-heading h2 { margin: 3px 0 5px; font-size: 22px; letter-spacing: -.025em; }
        .card-heading p { margin: 0; color: var(--wormhole-soft); font-size: 13px; line-height: 1.45; }
        .section-index { color: var(--wormhole-cyan); font-size: 9px; font-weight: 850; letter-spacing: .16em; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .behavior-card { margin-bottom: 20px; }
        .behavior-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .backup-section { margin-bottom: 22px; }
        .backup-heading { padding: 6px 4px 0; margin-bottom: 12px; }

        .wormhole-app .v-card { color: var(--wormhole-text) !important; }
        .wormhole-app .v-card:not(.glass-panel) { background: linear-gradient(145deg, rgba(20,26,48,.72), rgba(9,13,28,.60)) !important; border: 1px solid var(--wormhole-stroke) !important; border-radius: var(--wormhole-radius-xl) !important; box-shadow: var(--wormhole-shadow), inset 0 1px 0 rgba(255,255,255,.045) !important; }
        .wormhole-app .v-card-title { color: var(--wormhole-text); font-size: 18px; font-weight: 700; }
        .wormhole-app .v-card-text { color: var(--wormhole-soft); }
        .wormhole-app .v-field { color: var(--wormhole-text); border: 1px solid rgba(174,203,244,.14); border-radius: 13px; background: linear-gradient(145deg, rgba(11,17,33,.74), rgba(5,9,21,.62)); box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.14); }
        .wormhole-app .v-field__outline { display: none; }
        .wormhole-app .v-field--focused { border-color: rgba(87,232,255,.55); box-shadow: 0 0 0 3px rgba(87,232,255,.07), inset 0 1px 0 rgba(255,255,255,.03); }
        .wormhole-app .v-label, .wormhole-app .v-field-label { color: #dce5f8; opacity: .9; }
        .wormhole-app .v-input__details { color: var(--wormhole-faint); }
        .wormhole-app .v-tabs { margin-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,.075); }
        .wormhole-app .v-tab { color: var(--wormhole-faint); font-size: 12px; font-weight: 750; text-transform: none; }
        .wormhole-app .v-tab--selected { color: var(--wormhole-cyan-bright); }
        .wormhole-app .v-tab__slider { height: 2px; background: linear-gradient(90deg, var(--wormhole-cyan), var(--wormhole-violet)); box-shadow: 0 0 10px rgba(87,232,255,.42); }
        .wormhole-app .v-btn { border: 1px solid rgba(185,211,255,.13); border-radius: 11px; background: linear-gradient(145deg, rgba(22,30,52,.46), rgba(9,14,30,.40)); color: #ddd4ff; text-transform: none; letter-spacing: 0; }
        .wormhole-app .v-btn.bg-primary { color: #021116 !important; border-color: rgba(130,246,255,.55); background: linear-gradient(120deg, #72e8f8, #9df4ff) !important; box-shadow: 0 10px 24px rgba(54,205,230,.16); }
        .wormhole-app .v-alert { color: var(--wormhole-soft); border-color: rgba(181,213,255,.13) !important; background: rgba(11,17,32,.48) !important; border-radius: 13px; }
        .toggle-list { display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,.07); }
        .toggle-list .v-checkbox { padding: 8px 2px; border-bottom: 1px solid rgba(255,255,255,.06); }
        .wormhole-app .v-switch__track { background: rgba(91,106,137,.56); opacity: 1; }
        .wormhole-app .v-switch--inset .v-selection-control--dirty .v-switch__track { background: linear-gradient(90deg, rgba(50,203,226,.9), rgba(128,94,226,.9)); }
        .boxed-setting { min-height: 76px; padding: 10px 14px; border: 1px solid rgba(168,200,242,.09); border-radius: 13px; background: linear-gradient(145deg, rgba(17,24,43,.54), rgba(7,12,26,.40)); }
        .setting-section { padding: 16px 0 18px; border-top: 1px solid rgba(255,255,255,.07); }
        .setting-section:first-of-type { padding-top: 0; border-top: 0; }
        .setting-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .setting-label strong { font-size: 12px; }
        .setting-label span { color: var(--wormhole-faint); font-size: 9px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }

        .brand-mini { width: 16px; height: 16px; flex: 0 0 16px; border: 2px solid rgba(156,245,255,.8); border-left-color: var(--wormhole-violet); border-bottom-color: rgba(255,255,255,.14); border-radius: 46% 54% 43% 57%; box-shadow: 0 0 14px rgba(87,232,255,.42); transform: rotate(-25deg); }
        .about-hero { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 30px; padding: 34px; margin-bottom: 20px; border-radius: var(--wormhole-radius-xl); overflow: hidden; }
        .about-hero h2 { margin: 5px 0 8px; font-size: 31px; letter-spacing: -.035em; }
        .about-lead { max-width: 720px; margin: 0; color: var(--wormhole-soft); font-size: 14px; line-height: 1.6; }
        .about-emblem { position: relative; width: 120px; height: 120px; display: grid; place-items: center; justify-self: center; border: 1px solid rgba(160,218,255,.13); border-radius: 36px; background: linear-gradient(145deg, rgba(28,38,66,.48), rgba(6,10,23,.43)); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 22px 50px rgba(0,0,0,.25); }
        .about-emblem::before { content: ""; position: absolute; inset: 27px; border: 3px solid var(--wormhole-cyan); border-left-color: var(--wormhole-violet); border-bottom-color: var(--wormhole-magenta); border-radius: 46% 54% 43% 57%; box-shadow: 0 0 20px rgba(87,232,255,.42), inset 0 0 18px rgba(157,121,255,.24); transform: rotate(-28deg); }
        .about-emblem span { width: 34px; height: 34px; border-radius: 50%; background: #02040b; box-shadow: 0 0 0 8px rgba(4,8,20,.9), 0 0 25px rgba(87,232,255,.55); }
        .meta-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .meta-chips .glass-chip { padding: 7px 11px; border-radius: 999px; color: #c9d7ee; font-size: 10px; font-weight: 750; }
        .about-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 20px; margin-bottom: 20px; }
        .info-list { margin: 0; }
        .info-list div { display: grid; grid-template-columns: 120px 1fr; gap: 18px; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.06); }
        .info-list dt { color: var(--wormhole-faint); font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        .info-list dd { margin: 0; color: var(--wormhole-text); font-size: 12px; font-weight: 650; }
        .credits-copy, .license-row p { color: var(--wormhole-soft); font-size: 12px; line-height: 1.6; }
        .credit-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .credit-links a { padding: 8px 11px; border: 1px solid rgba(157,121,255,.22); border-radius: 10px; color: #ddd4ff; background: rgba(121,84,210,.10); font-size: 11px; }
        .license-card { margin-bottom: 20px; }
        .license-row { display: flex; align-items: center; gap: 16px; }
        .license-badge { padding: 9px 14px; border-radius: 12px; color: var(--wormhole-cyan-bright); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
        .diagnostics-card { margin-top: 20px; }
        .page-footer { display: flex; align-items: center; justify-content: center; gap: 13px; padding: 10px 0 0; color: var(--wormhole-faint); font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        .footer-line { width: 48px; height: 1px; background: linear-gradient(90deg, transparent, rgba(111,227,255,.34), transparent); }

        @media (max-width: 1050px) {
            :root { --wormhole-sidebar: 238px; }
            .sidebar { width: 222px; }
            .main-content { padding-right: 25px; padding-left: 25px; }
            .settings-grid, .behavior-grid, .about-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 760px) {
            .app-shell { display: block; }
            .sidebar { position: relative; inset: auto; width: auto; margin: 10px; }
            .brand { padding: 16px; }
            .navigation { display: grid; grid-template-columns: 1fr 1fr; padding-bottom: 12px; }
            .nav-separator, .sidebar-footer { display: none; }
            .main-content { width: 100%; padding: 26px 15px 34px; }
            .page-header { align-items: flex-start; flex-direction: column; }
            .header-status { width: 100%; }
            .card { padding: 22px 18px; }
            .about-hero { grid-template-columns: 1fr; text-align: center; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
<div class="space" aria-hidden="true">
    <div class="wormhole wormhole--outer"></div>
    <div class="wormhole wormhole--inner"></div>
    <div class="star-field"></div>
</div>
<div id="main"></div>
</body>
</html>
