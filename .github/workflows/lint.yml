name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
  push:
    branches:
      - master
      - dev
      - release/public-hardening-candidate
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=error

      - name: Run complete project checks
        run: npm run check

      - name: Show formatting differences after failure
        if: failure()
        shell: bash
        run: |
          npm run format -- --log-level=error >/dev/null
          git --no-pager diff -- src tests scripts

      - name: Prepare browser artifacts
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/public-hardening-candidate'
        run: npm run package:artifacts

      - name: Read package version
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/public-hardening-candidate'
        id: package
        run: |
          node -e "process.stdout.write('version=' + require('./package.json').version + '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload Firefox package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/public-hardening-candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wormhole-connector-${{ steps.package.outputs.version }}-firefox-unsigned
          path: artifacts/wormhole-connector-${{ steps.package.outputs.version }}-firefox-unsigned.xpi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Chrome package
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/public-hardening-candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wormhole-connector-${{ steps.package.outputs.version }}-chrome
          path: artifacts/wormhole-connector-${{ steps.package.outputs.version }}-chrome.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload SHA-256 checksums
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/public-hardening-candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wormhole-connector-${{ steps.package.outputs.version }}-checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload matching source archive
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/public-hardening-candidate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wormhole-connector-${{ steps.package.outputs.version }}-source
          path: artifacts/wormhole-connector-${{ steps.package.outputs.version }}-source.zip
          if-no-files-found: error
          retention-days: 14
