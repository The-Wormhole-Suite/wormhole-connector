name: Publish v5.1.0-beta.2 glass + icons

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

permissions:
  contents: write
  actions: write

env:
  CI: true

jobs:
  publish:
    if: github.event.pull_request.merged == true && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          show-progress: false

      - name: Build final Connector icon set
        shell: bash
        run: |
          set -euo pipefail
          cat .release-tmp/connector-128.a{a,b,c,d} | base64 --decode > icon/icon-128.png
          base64 --decode .release-tmp/connector-48.b64 > icon/icon-48.png
          base64 --decode .release-tmp/connector-16.b64 > icon/icon-16.png

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

          convert icon/icon-128.png -filter Lanczos -resize 96x96 icon/icon-96.png
          convert icon/icon-48.png -filter Lanczos -resize 32x32 icon/icon-32.png

          for state in active blocked disabled error temporary unknown; do
            cp icon/icon-16.png "icon/toolbar/${state}-16.png"
            cp icon/icon-32.png "icon/toolbar/${state}-32.png"
            cp icon/icon-48.png "icon/toolbar/${state}-48.png"
          done

          identify icon/icon-16.png icon/icon-32.png icon/icon-48.png icon/icon-96.png icon/icon-128.png

      - name: Install dependencies
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate release candidate
        run: |
          npm ci
          npm run check

      - name: Commit final assets and remove one-time staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon
          git rm -r .release-tmp .github/workflows/publish-v5.1.0-beta.2.yml
          git commit -m 'Apply final Wormhole Connector icons for v5.1.0-beta.2'
          git push origin HEAD:dev

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG='v5.1.0-beta.2'
          git fetch origin dev --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi
          git tag -a "$TAG" -m 'Wormhole Connector 5.1.0-beta.2'
          git push origin "$TAG"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v5.1.0-beta.2'
          BEFORE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref dev -f tag="$TAG"

          RUN_ID=''
          for _ in $(seq 1 18); do
            CURRENT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$CURRENT" && "$CURRENT" != "$BEFORE" ]]; then
              RUN_ID="$CURRENT"
              break
            fi
            sleep 5
          done
          [[ -n "$RUN_ID" ]]
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v5.1.0-beta.2'
          RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,assets,url)
          [[ "$(jq -r '.isDraft' <<<"$RELEASE_JSON")" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" == 'true' ]]
          [[ "$(jq -r '.tagName' <<<"$RELEASE_JSON")" == "$TAG" ]]
          for ASSET in \
            'wormhole-connector-5.1.0-beta.2-firefox-unsigned.xpi' \
            'wormhole-connector-5.1.0-beta.2-chrome.zip' \
            'wormhole-connector-5.1.0-beta.2-source.zip' \
            'SHA256SUMS.txt'; do
            jq -e --arg asset "$ASSET" '.assets | any(.name == $asset)' <<<"$RELEASE_JSON" >/dev/null
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
